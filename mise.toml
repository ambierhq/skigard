[tools]
go = "1.27"
golangci-lint = "2.15.0"
editorconfig-checker = "4.0.2"

[tasks.build]
description = "Build ./dist/skigard"
run = "go build -trimpath -ldflags \"-s -w -X github.com/ambierhq/skigard/internal/cli.Version=$(git describe --tags --always --dirty 2>/dev/null || echo dev)\" -o dist/skigard ./cmd/skigard"

[tasks.test]
description = "Unit tests"
run = "go test ./..."

[tasks.lint]
description = "golangci-lint (includes gofmt/goimports and gosec) and editorconfig"
run = [
  "golangci-lint run ./...",
  "golangci-lint fmt --diff ./...",
  "editorconfig-checker",
]

[tasks.fmt]
description = "Format Go code"
run = "golangci-lint fmt ./..."

[tasks.check]
description = "lint + tests"
depends = ["lint", "test"]

[tasks.e2e]
description = "End-to-end test of the built binary (approve through a real pty)"
run = "scripts/e2e.sh"

[tasks.e2e-windows]
description = "Windows end-to-end test, including approve through a ConPTY (run on Windows)"
run = "go test -tags e2e -count=1 -v ./e2e/windows"

[tasks.fuzz]
description = "Short fuzz runs"
run = [
  "go test ./internal/source -run XXX -fuzz=FuzzParse -fuzztime=20s",
  "go test ./internal/safefs -run XXX -fuzz=FuzzCleanEntry -fuzztime=20s",
  "go test ./internal/skill -run XXX -fuzz=FuzzFrontmatter -fuzztime=20s",
  "go test ./internal/review -run XXX -fuzz=FuzzParse -fuzztime=20s",
]

[tasks.docs]
description = "Regenerate docs/harnesses.md and docs/rules.md"
run = [
  "go test ./internal/harness -run Docs -update",
  "go test ./internal/scan -run Docs -update",
]

[tasks.vuln]
description = "govulncheck (pinned)"
run = "go run golang.org/x/vuln/cmd/govulncheck@v1.10.0 ./..."

[tasks.snapshot]
description = "Local GoReleaser snapshot build into ./dist (no signing, SBOM, docker or publishing)"
run = "go run github.com/goreleaser/goreleaser/v2@v2.20.2 release --snapshot --clean --skip=sign,sbom,docker,publish"
