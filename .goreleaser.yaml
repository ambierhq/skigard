# yaml-language-server: $schema=https://goreleaser.com/static/schema.json
version: 2
project_name: skigard

before:
  hooks:
    - go mod verify
    # Shell completions are generated from the CLI itself and packaged into archives and nfpms.
    - sh -c 'rm -rf completions && mkdir completions && go run ./cmd/skigard completion bash > completions/skigard.bash && go run ./cmd/skigard completion zsh > completions/_skigard && go run ./cmd/skigard completion fish > completions/skigard.fish && go run ./cmd/skigard completion powershell > completions/skigard.ps1'

builds:
  - id: skigard
    main: ./cmd/skigard
    binary: skigard
    env: [CGO_ENABLED=0]
    goos: [darwin, linux, windows]
    goarch: [amd64, arm64]
    flags: [-trimpath]
    mod_timestamp: "{{ .CommitTimestamp }}"
    ldflags:
      - -s -w -X github.com/ambierhq/skigard/internal/cli.Version={{.Version}}

archives:
  - id: skigard
    formats: [tar.gz]
    # Do not change: mise (ubi:, github:) and eget rely on this pattern, with the binary at the archive root.
    name_template: "{{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}"
    format_overrides:
      - goos: windows
        formats: [zip]
    files:
      - LICENSE
      - THIRD_PARTY_NOTICES.md
      - README.md
      - src: completions/*
        dst: completions
        strip_parent: true

checksum:
  name_template: checksums.txt
  algorithm: sha256

sboms:
  - id: archive-sbom
    artifacts: archive
    documents: ["${artifact}.sbom.json"]
    cmd: syft
    args: ["${artifact}", "--output", "spdx-json=${document}"]

# Keyless signing (GitHub OIDC). Verify with:
#   cosign verify-blob --bundle checksums.txt.sigstore.json \
#     --certificate-identity-regexp '^https://github.com/ambierhq/skigard/\.github/workflows/release\.yml@refs/tags/v' \
#     --certificate-oidc-issuer https://token.actions.githubusercontent.com checksums.txt
signs:
  - id: checksum
    cmd: cosign
    artifacts: checksum
    signature: "${artifact}.sigstore.json"
    args: ["sign-blob", "--yes", "--bundle=${signature}", "${artifact}"]
  - id: archive
    cmd: cosign
    artifacts: archive
    signature: "${artifact}.sigstore.json"
    args: ["sign-blob", "--yes", "--bundle=${signature}", "${artifact}"]

nfpms:
  - id: skigard
    package_name: skigard
    file_name_template: "{{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}"
    vendor: Ambier Oy
    maintainer: Ambier Oy <skigard@ambierhq.com>
    homepage: https://github.com/ambierhq/skigard
    description: Lockfile and review gate for agent skills
    license: MIT
    formats: [deb, rpm, apk, archlinux]
    bindir: /usr/bin
    contents:
      - src: LICENSE
        dst: /usr/share/licenses/skigard/LICENSE
      - src: completions/skigard.bash
        dst: /usr/share/bash-completion/completions/skigard
      - src: completions/_skigard
        dst: /usr/share/zsh/site-functions/_skigard
      - src: completions/skigard.fish
        dst: /usr/share/fish/vendor_completions.d/skigard.fish

# Publishers. Each one is skipped unless its token is present in the environment.
# Homebrew: GoReleaser v2.20 deprecates `brews` and its replacement `homebrew_casks` is macOS-only, so the
# formula (macOS and Linux) is rendered by scripts/homebrew-formula.sh in the release workflow instead.

scoops:
  - name: skigard
    ids: [skigard]
    homepage: https://github.com/ambierhq/skigard
    description: Lockfile and review gate for agent skills
    license: MIT
    skip_upload: '{{ if index .Env "SCOOP_BUCKET_TOKEN" }}false{{ else }}true{{ end }}'
    repository:
      owner: ambierhq
      name: scoop-bucket
      token: '{{ .Env.SCOOP_BUCKET_TOKEN }}'

# winget is NOT published by GoReleaser: its publisher writes the manifests through the GitHub Contents API, which times
# out on the ~1 GB winget-pkgs fork (v0.1.1). The `winget` job in release.yml renders them with scripts/winget-manifests.sh
# and pushes them with plain git instead.

# The installers are release assets so ambierhq.com/skigard/install.{sh,ps1} can redirect to
# https://github.com/ambierhq/skigard/releases/latest/download/install.{sh,ps1}.
release:
  extra_files:
    - glob: scripts/install.sh
    - glob: scripts/install.ps1

changelog:
  sort: asc
  filters:
    exclude: ["^docs:", "^test:", "^chore:", "^ci:"]
