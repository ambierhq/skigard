# Generated by `skigard init-ci`. Pin every action to a full commit SHA before committing.
# The check fails the build when an approved skill, the lockfile, the installs or the marketplace drift,
# or when something unapproved appears. It never approves anything: approval is for a human at a terminal.
name: skigard
on:
  pull_request:
  push:
    branches: [main]
permissions: {}
jobs:
  verify:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@REPLACE_WITH_FULL_COMMIT_SHA # v4 or newer
        with:
          persist-credentials: false
      - uses: ambierhq/skigard-action@@ACTION_SHA@ # v1
        with:
          version: @VERSION@
