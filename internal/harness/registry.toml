# skigard harness registry.
#
# One entry per agent harness that reads Agent Skills from a directory.
#   global   user-scope skills dir; "~" = home (%USERPROFILE% on Windows),
#            "{config}" = $XDG_CONFIG_HOME, else ~/.config (on Windows %APPDATA%)
#   project  project-scope skills dir, relative to the project root
#   env_home / env_sub  if env var env_home is set, the global dir is $env_home/env_sub
#   bins     executables whose presence means "installed"
#   dirs     config dirs whose presence means "configured" (default: parent of global)
#   apps     macOS app bundles whose presence means "installed"
#   env      environment variables set when skigard runs inside this harness
#   verified skigard has confirmed the paths against the harness's own documentation
#            or a machine that runs it. Unverified entries are listed by `detect`
#            but only installed to with --include-unverified.
#
# Paths were gathered by studying how other skill managers lay out ~75 agents
# (see README credits) and then written down independently. Please send a PR to
# fix or verify any entry.
harness = [
  { id = "claude-code", name = "Claude Code", project = ".claude/skills", global = "~/.claude/skills", env_home = "CLAUDE_CONFIG_DIR", env_sub = "skills", bins = ["claude"], env = ["CLAUDECODE"], verified = true },
  { id = "pi", name = "Pi", project = ".agents/skills", global = "~/.agents/skills", bins = ["pi"], dirs = ["~/.pi"], env = ["PI_CODING_AGENT"], verified = true },
  { id = "omp", name = "Oh My Pi", project = ".agents/skills", global = "~/.agents/skills", bins = ["omp"], dirs = ["~/.omp"], verified = true },
