name: Bug report
description: Something does not work as documented
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Security problems (a way to bypass approval, escape the quarantine, or forge the lockfile)
        must go through [SECURITY.md](https://github.com/ambierhq/skigard/security/policy), not here.
  - type: input
    id: version
    attributes:
      label: skigard version
      description: Output of `skigard --version`
    validations:
      required: true
  - type: input
    id: os
    attributes:
      label: OS and architecture
      placeholder: macOS 15 arm64, Ubuntu 24.04 amd64, Windows 11 amd64
    validations:
      required: true
  - type: textarea
    id: what
    attributes:
      label: What happened, and what did you expect?
    validations:
      required: true
  - type: textarea
    id: repro
    attributes:
      label: Steps to reproduce
      render: shell
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Output
      description: Remove anything private first.
      render: text
