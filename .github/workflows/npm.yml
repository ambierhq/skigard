name: npm
# Tests the npm launcher (npm/) and the package builder (scripts/npm-pack.mjs) against the real binary.
on:
  push: {branches: [main]}
  pull_request:
    paths:
      - npm/**
      - scripts/npm-pack.mjs
      - scripts/npm-smoke.sh
      - scripts/pty_approve.py
      - .github/workflows/npm.yml
  workflow_dispatch:
permissions: {}
jobs:
  test:
    permissions: {contents: read}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix: {os: [ubuntu-latest, macos-latest, windows-latest]}
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: {persist-credentials: false}
      - uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        with: {go-version-file: go.mod, cache: false}
      - name: node tests (launcher, exit codes, stdio, approve through a pty)
        run: node --test "npm/test/*.test.mjs"
  pack:
    needs: test
    permissions: {contents: read}
    timeout-minutes: 20
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: {fetch-depth: 0, persist-credentials: false}
      - uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        with: {go-version-file: go.mod, cache: false}
      - uses: goreleaser/goreleaser-action@a4f02ab5355a589de60d917a659ce617ed19b3de # v7.3.0
        with:
          distribution: goreleaser
          version: v2.20.2
          args: release --snapshot --clean --skip=sign,sbom,publish
      - name: pack from the snapshot, install the tarballs, run through npx and a pty
        run: scripts/npm-smoke.sh dist "$(jq -r .version dist/metadata.json)"
