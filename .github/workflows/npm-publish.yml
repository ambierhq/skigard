name: npm-publish
# Publishes skigard and @ambierhq/skigard-<os>-<cpu> to npm after the `release` workflow succeeded on a tag.
# Trusted publishing (OIDC) with provenance: no NPM_TOKEN exists. It does nothing unless the repository variable
# NPM_PUBLISH is "true" (set it after the @ambierhq org and the trusted publishers are configured on npmjs.com).
on:
  workflow_run:
    workflows: [release]
    types: [completed]
  workflow_dispatch:
    inputs:
      tag: {description: "release tag to publish, e.g. v0.1.0", required: true}
permissions: {}
jobs:
  publish:
    if: >-
      vars.NPM_PUBLISH == 'true' &&
      (github.event_name == 'workflow_dispatch' ||
       (github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'push' &&
        startsWith(github.event.workflow_run.head_branch, 'v')))
    permissions:
      contents: read
      id-token: write   # npm trusted publishing + provenance
    timeout-minutes: 20
    runs-on: ubuntu-latest
    environment: npm
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: {persist-credentials: false}
      - name: resolve the tag
        env:
          INPUT_TAG: ${{ inputs.tag }}
          RUN_TAG: ${{ github.event.workflow_run.head_branch }}
        run: |
          tag="${INPUT_TAG:-$RUN_TAG}"
          case "$tag" in v[0-9]*.[0-9]*.[0-9]*) ;; *) echo "bad tag: $tag" >&2; exit 1 ;; esac
          echo "TAG=$tag" >> "$GITHUB_ENV"
      - name: download the archives and verify them against checksums.txt
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          mkdir dist
          gh release download "$TAG" --dir dist --pattern 'skigard_*.tar.gz' --pattern 'skigard_*.zip' --pattern checksums.txt
          (cd dist && grep -E '\.(tar\.gz|zip)$' checksums.txt | sha256sum --check --strict)
      - name: build the packages (versions equal the tag)
        run: node scripts/npm-pack.mjs --dist dist --version "${TAG#v}" --out npm-dist --pack
      - name: npm with trusted publishing support
        run: npm install --global npm@11.21.3
      - name: publish (platform packages first, then the launcher)
        run: |
          version="${TAG#v}"
          tag_flag=()
          case "$version" in *-*) tag_flag=(--tag next) ;; esac
          for t in npm-dist/tarballs/ambierhq-skigard-*.tgz npm-dist/tarballs/skigard-*.tgz; do
            name="$(tar -xOzf "$t" package/package.json | jq -r .name)"
            if npm view "$name@$version" version >/dev/null 2>&1; then echo "$name@$version already published"; continue; fi
            npm publish "$t" --provenance --access public "${tag_flag[@]}"
          done
