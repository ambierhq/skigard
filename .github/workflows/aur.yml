name: aur
# Updates the AUR packages `skigard` and `skigard-bin` after a release. Does nothing without the AUR_SSH_KEY secret.
# The key is the owner's; the owner also decides when to create the AUR packages for the first time.
on:
  workflow_run:
    workflows: [release]
    types: [completed]
  workflow_dispatch:
    inputs:
      tag: {description: "release tag, e.g. v0.1.0", required: true}
permissions: {}
jobs:
  aur:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'push' &&
        startsWith(github.event.workflow_run.head_branch, 'v'))
    permissions: {contents: read}
    timeout-minutes: 10
    runs-on: ubuntu-latest
    environment: aur
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: {persist-credentials: false}
      - name: render and push
        env:
          AUR_SSH_KEY_DATA: ${{ secrets.AUR_SSH_KEY }}
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          INPUT_TAG: ${{ inputs.tag }}
          RUN_TAG: ${{ github.event.workflow_run.head_branch }}
        run: |
          if [ -z "$AUR_SSH_KEY_DATA" ]; then
            echo "::notice::AUR_SSH_KEY is not set; not updating the AUR"
            exit 0
          fi
          tag="${INPUT_TAG:-$RUN_TAG}"
          case "$tag" in v[0-9]*.[0-9]*.[0-9]*) ;; *) echo "bad tag: $tag" >&2; exit 1 ;; esac
          case "$tag" in *-*) echo "pre-release $tag is not published to the AUR"; exit 0 ;; esac
          mkdir dist && gh release download "$tag" --dir dist --pattern checksums.txt
          packaging/aur/update.sh "${tag#v}" dist/checksums.txt aur-out
          umask 077
          printf '%s\n' "$AUR_SSH_KEY_DATA" > "$RUNNER_TEMP/aur_key"
          AUR_SSH_KEY="$RUNNER_TEMP/aur_key" packaging/aur/push.sh aur-out "${tag#v}"
