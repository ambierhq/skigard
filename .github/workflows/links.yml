name: links
on:
  schedule:
    - cron: "11 6 * * 1"
  workflow_dispatch:
permissions: {}
jobs:
  lychee:
    permissions: {contents: read}
    timeout-minutes: 15
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: {persist-credentials: false}
      - uses: lycheeverse/lychee-action@e7477775783ea5526144ba13e8db5eec57747ce8 # v2.9.0
        with:
          args: --no-progress --max-concurrency 8 --accept 200,206,429 --exclude '^https://releases\.ambierhq\.com/' --exclude-path docs/maintenance './**/*.md'
          fail: true
