name: site
on:
  push:
    branches: [main]
    paths: ["website/**", "docs/**", "README.md", "internal/harness/registry.toml", "assets/brand/**", ".github/workflows/site.yml"]
  pull_request:
    paths: ["website/**", "docs/**", "README.md", "internal/harness/registry.toml", "assets/brand/**", ".github/workflows/site.yml"]
  workflow_dispatch:
permissions: {}
concurrency:
  group: site-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
jobs:
  build:
    permissions: {contents: read}
    timeout-minutes: 20
    runs-on: ubuntu-latest
    defaults: {run: {working-directory: website}}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: {persist-credentials: false}
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "26.13.1"
          cache: npm
          cache-dependency-path: website/package-lock.json
      - run: npm ci --ignore-scripts
      - run: npm run build
      - run: npm run check:links
      - name: No horizontal overflow (320-1280 px)
        run: CHROME_PATH="$(command -v google-chrome || command -v chromium)" npm run check:overflow
      - name: Lighthouse CI (all four categories >= 0.95)
        run: npm run lhci
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: site-deploy
          path: website/deploy
          retention-days: 7
  deploy:
    needs: build
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    permissions: {contents: read}
    timeout-minutes: 10
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      WRANGLER_SEND_METRICS: "false"
    defaults: {run: {working-directory: website}}
    steps:
      - name: Skip when no Cloudflare token is configured
        id: gate
        working-directory: .  # no checkout has happened yet, so the default `website` directory does not exist
        run: |
          if [ -n "$CLOUDFLARE_API_TOKEN" ]; then echo "go=true" >> "$GITHUB_OUTPUT"; else echo "No CLOUDFLARE_API_TOKEN, skipping deploy."; fi
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        if: steps.gate.outputs.go == 'true'
        with: {persist-credentials: false}
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        if: steps.gate.outputs.go == 'true'
        with:
          node-version: "26.13.1"
          cache: npm
          cache-dependency-path: website/package-lock.json
      - if: steps.gate.outputs.go == 'true'
        run: npm ci --ignore-scripts
      - if: steps.gate.outputs.go == 'true'
        run: npm run build
      - if: steps.gate.outputs.go == 'true'
        run: npx --no-install wrangler deploy
