name: nixpkgs
# Advisory: builds packaging/nixpkgs/package.nix inside a nixpkgs master checkout, as it would be submitted.
on:
  pull_request:
    paths:
      - packaging/nixpkgs/**
      - .github/workflows/nixpkgs.yml
  workflow_dispatch:
permissions: {}
jobs:
  build:
    permissions: {contents: read}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix: {os: [ubuntu-latest, macos-latest]}
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: {persist-credentials: false}
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: {repository: NixOS/nixpkgs, ref: master, path: nixpkgs, fetch-depth: 1, persist-credentials: false}
      - uses: cachix/install-nix-action@3dc140bfc76c49fbd4dd958429132e3746bcb086 # v31.11.5
        with: {extra_nix_config: "sandbox = true"}
      - name: place package.nix as submitted
        run: |
          mkdir -p nixpkgs/pkgs/by-name/sk/skigard
          cp packaging/nixpkgs/package.nix nixpkgs/pkgs/by-name/sk/skigard/package.nix
      - name: nixfmt
        working-directory: nixpkgs
        run: nix-shell -p nixfmt --run 'nixfmt --check pkgs/by-name/sk/skigard/package.nix'
      - name: build
        working-directory: nixpkgs
        run: nix-build -A skigard --option sandbox true --print-build-logs
      - name: version
        working-directory: nixpkgs
        run: |
          ./result/bin/skigard version
          ls result/share/bash-completion/completions result/share/zsh/site-functions result/share/fish/vendor_completions.d
      - name: passthru.tests (if any)
        working-directory: nixpkgs
        run: |
          if nix-instantiate --eval -A skigard.tests --strict --json >/dev/null 2>&1 && [ "$(nix-instantiate --eval -A skigard.tests --strict --json 2>/dev/null)" != '{}' ]; then
            nix-build -A skigard.tests
          else
            echo "no passthru.tests"
          fi
