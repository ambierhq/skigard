name: workflow-lint
on:
  push: {branches: [main]}
  pull_request:
    paths: [".github/**", ".goreleaser.yaml"]
permissions: {}
jobs:
  actionlint:
    permissions: {contents: read}
    timeout-minutes: 10
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: {persist-credentials: false}
      - uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        with: {go-version-file: go.mod}
      - run: go run github.com/rhysd/actionlint/cmd/actionlint@v1.7.12 -color
  zizmor:
    permissions: {contents: read}
    timeout-minutes: 10
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: {persist-credentials: false}
      - uses: zizmorcore/zizmor-action@45d7276c9ca790aabd705e31ca99c6185c3e76dd # v0.8.1
        with:
          version: v1.32.0
          advanced-security: false
          annotations: true
