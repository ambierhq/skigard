name: repos
# Builds the signed apt / rpm / pacman repositories (packaging/repos) and deploys them to the Cloudflare Worker
# `ambier-releases` (static assets, https://releases.ambierhq.com). No R2.
#  - pull requests touching packaging/repos: build from a GoReleaser snapshot with a THROWAWAY key and install from the
#    result in clean ubuntu/debian/fedora/arch containers. Nothing is deployed.
#  - after the `release` workflow succeeds on a tag: build from the last 3 releases with the real key and deploy,
#    but only when GPG_PRIVATE_KEY and CLOUDFLARE_API_TOKEN exist. Without them the job reports and exits green.
on:
  pull_request:
    paths:
      - packaging/repos/**
      - .github/workflows/repos.yml
  workflow_run:
    workflows: [release]
    types: [completed]
  workflow_dispatch:
permissions: {}
jobs:
  build:
    # workflow_run fires for the snapshot runs of `release` too; only tag pushes publish.
    if: >-
      github.event_name != 'workflow_run' ||
      (github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'push' &&
       startsWith(github.event.workflow_run.head_branch, 'v'))
    permissions: {contents: read}
    timeout-minutes: 30
    runs-on: ubuntu-latest
    env:
      PUBLISH: ${{ github.event_name == 'workflow_run' && 'true' || 'false' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: {fetch-depth: 0, persist-credentials: false}
      - name: tools
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq dpkg-dev createrepo-c rpm gnupg shellcheck
          shellcheck -x packaging/repos/*.sh
      - name: signing key
        env:
          GPG_PRIVATE_KEY: ${{ secrets.GPG_PRIVATE_KEY }}
        run: |
          umask 077
          if [ "$PUBLISH" = true ] && [ -n "$GPG_PRIVATE_KEY" ]; then
            printf '%s\n' "$GPG_PRIVATE_KEY" > "$RUNNER_TEMP/key.asc"
            echo "SIGNED_FOR_REAL=true" >> "$GITHUB_ENV"
          else
            echo "::notice::no GPG_PRIVATE_KEY (or not a release): using a throwaway key, nothing will be deployed"
            export GNUPGHOME="$RUNNER_TEMP/throwaway"; mkdir -m 700 "$GNUPGHOME"
            gpg --batch --quick-gen-key --passphrase '' "skigard repos CI (throwaway) <ci@example.invalid>" rsa3072 sign 1d
            gpg --batch --armor --export-secret-keys > "$RUNNER_TEMP/key.asc"
            echo "SIGNED_FOR_REAL=false" >> "$GITHUB_ENV"
          fi
      - name: packages (snapshot)
        if: env.PUBLISH != 'true'
        uses: goreleaser/goreleaser-action@a4f02ab5355a589de60d917a659ce617ed19b3de # v7.3.0
        with:
          distribution: goreleaser
          version: v2.20.2
          args: release --snapshot --clean --skip=sign,sbom,docker,publish
      - uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        if: env.PUBLISH != 'true'
        with: {go-version-file: go.mod, cache: false}
      - name: packages (last 3 releases)
        if: env.PUBLISH == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          mkdir dist
          for tag in $(gh release list --exclude-pre-releases --limit 3 --json tagName --jq '.[].tagName'); do
            gh release download "$tag" --dir dist --pattern '*.deb' --pattern '*.rpm' --pattern '*.pkg.tar.zst'
          done
          ls -l dist
      - name: apt and rpm
        env:
          GPG_PASSPHRASE: ${{ secrets.GPG_PASSPHRASE }}
        run: |
          GPG_PRIVATE_KEY="$(cat "$RUNNER_TEMP/key.asc")" packaging/repos/build-all.sh dist repos-dist apt rpm
      - name: pacman (archlinux container)
        env:
          GPG_PASSPHRASE: ${{ secrets.GPG_PASSPHRASE }}
        run: |
          GPG_PRIVATE_KEY="$(cat "$RUNNER_TEMP/key.asc")" docker run --rm -e GPG_PRIVATE_KEY -e GPG_PASSPHRASE \
            -v "$PWD:/w" -w /w archlinux:latest sh -ec '
              pacman -Sy --noconfirm --needed pacman-contrib gnupg libarchive bash >/dev/null
              packaging/repos/build-all.sh dist repos-dist arch
              chown -R '"$(id -u):$(id -g)"' repos-dist'
      - name: files and sizes
        run: |
          find repos-dist -type f | sort
          du -sh repos-dist
      - name: install from the repositories in clean containers
        if: env.SIGNED_FOR_REAL != 'true'
        run: |
          for spec in apt:ubuntu:22.04 apt:ubuntu:24.04 apt:debian:12 rpm:fedora:latest arch:archlinux:latest; do
            kind="${spec%%:*}"; image="${spec#*:}"
            echo "::group::$kind in $image"
            docker run --rm -v "$PWD/repos-dist:/repo:ro" -v "$PWD/packaging/repos/test-container.sh:/t.sh:ro" "$image" sh /t.sh "$kind" /repo
            echo "::endgroup::"
          done
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: repos-dist
          path: repos-dist/
          retention-days: 3
  deploy:
    needs: build
    if: github.event_name == 'workflow_run'
    permissions: {contents: read}
    timeout-minutes: 15
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: {persist-credentials: false}
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with: {name: repos-dist, path: repos-dist}
      - name: deploy the ambier-releases Worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          HAVE_KEY: ${{ secrets.GPG_PRIVATE_KEY != '' }}
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ] || [ "$HAVE_KEY" != true ]; then
            echo "::notice::CLOUDFLARE_API_TOKEN or GPG_PRIVATE_KEY is not set; not deploying the package repositories"
            exit 0
          fi
          npx --yes wrangler@4.165.0 deploy --config packaging/repos/wrangler.jsonc --assets "$PWD/repos-dist"
